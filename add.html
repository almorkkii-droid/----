{% extends "base.html" %}{% block content %}<main class="form"><h1>إضافة إعلان جديد</h1><form method="post" enctype="multipart/form-data"><label>عنوان الإعلان<input name="title" placeholder="مثال: كامري 2018 مصدومة أمامي" required></label><div class="row"><label>القسم<select name="category"><option>سيارات مصدومة</option><option>سيارات عطلانة</option><option>تشليح</option><option>قطع غيار</option></select></label><label>السعر<input type="number" name="price" required></label></div><div class="row"><label>المدينة<input name="city" required></label><label>السنة<input type="number" name="year"></label></div><label>نوع الضرر<input name="damage" placeholder="صدمة أمامية / خلفية / عطل ميكانيكي"></label><label>الوصف<textarea name="description"></textarea></label><label>صورة السيارة<input type="file" name="image" accept="image/*"></label><button>نشر الإعلان</button></form></main>{% endblock %}
