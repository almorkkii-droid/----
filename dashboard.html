{% extends "base.html" %}{% block content %}<main><div class="head"><h1>لوحة التحكم</h1><a class="btn" href="/add">+ إعلان جديد</a></div><p>مرحبًا {{session.user_name}} 👋</p><div class="grid">{% for ad in ads %}<div class="card"><div class="photo">🚗💥</div><div class="body"><h3>{{ad.title}}</h3><strong>{{"{:,}".format(ad.price)}} ر.س</strong><form method="post" action="/delete/{{ad.id}}" onsubmit="return confirm('حذف الإعلان؟')"><button class="danger">حذف</button></form></div></div>{% else %}<p>لم تضف أي إعلان حتى الآن.</p>{% endfor %}</div></main>{% endblock %}
